<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tango Para La Vida</title>
  <meta name="description" content="" />

  <link rel="icon" type="image/png" href="assets/favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (Play CDN, no build step). Theme is extended below with the
       project's exact brand colors (from colores.md), radii, shadows and the
       "premium" easing from general-style.md, so all utility classes stay a
       single source of truth. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Motion is progressive: elements only start hidden when this class is present (see motion.css).
    document.documentElement.classList.add('fx');
    tailwind.config = {
      // Hover styles only where a real hover exists, so touch taps don't leave cards "stuck" lifted.
      future: { hoverOnlyWhenSupported: true },
      theme: {
        extend: {
          colors: {
            principal: '#073a7c',
            secundario: '#3782d3',
            // secundario darkened ~18% toward black for TEXT (5.5:1 on white); the raw blue is 3.97:1.
            'secundario-ink': '#2d6bad',
            acento: '#7A1F2B',
            detalle: '#f6b40e',
            texto: '#2C2C2A',
            header: '#F2EEE6',
            bg: '#f6f6f6',
            surface: '#ffffff'
          },
          fontFamily: {
            sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif']
          },
          borderRadius: {
            sm: '14px',
            md: '20px',
            lg: '28px'
          },
          boxShadow: {
            card: '0 1px 2px rgba(7,58,124,0.05)',
            'card-hover': '0 18px 40px rgba(7,58,124,0.12)',
            button: '0 8px 20px rgba(246,180,14,0.32)'
          },
          transitionTimingFunction: {
            premium: 'cubic-bezier(0.22, 1, 0.36, 1)'
          },
          keyframes: {
            drift: {
              '0%': { transform: 'translate3d(0,0,0) scale(1)' },
              '100%': { transform: 'translate3d(0,3%,0) scale(1.05)' }
            }
          },
          animation: {
            drift: 'drift 22s ease-in-out infinite alternate'
          }
        }
      }
    };
  </script>

  <!-- daisyUI (component layer on top of Tailwind): buttons, cards, badges, inputs,
       collapse (FAQ) and tabs (level selector). We only use its *structural* classes
       (.btn, .card, .badge, .input, .tabs, .collapse...) and always pair them with our
       own bg-*/text-* brand-color utilities above, so the exact palette never drifts
       into daisyUI's own theme colors. -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />

  <!-- Motion system (replaces AOS): every scroll reveal and text animation lives in
       motion.css + motion.js, driven by data-fx / data-text attributes. -->
  <link href="motion.css" rel="stylesheet" />

  <style>
    html { scroll-behavior: smooth; scroll-padding-top: 90px; }
    body { font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif; }
    [x-cloak] { display: none !important; }
    /* daisyUI paints the selected tab with its own primary (violet) at higher specificity than
       our utilities; pin it to the brand navy so the selected level always matches the palette. */
    .tabs-boxed .tab[aria-selected="true"]:not(.tab-disabled):not([disabled]) { --tw-bg-opacity: 1; background-color: #073a7c; border-color: #073a7c; color: #fff; }
    /* Skip link: hidden until focused by keyboard. */
    .skip-link { position: absolute; left: 16px; top: -64px; z-index: 100; padding: 10px 18px; border-radius: 9999px; background: #073a7c; color: #fff; font-weight: 700; font-size: 14px; transition: top 0.2s cubic-bezier(0.23, 1, 0.32, 1); }
    .skip-link:focus { top: 12px; outline: 2px solid #f6b40e; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition-duration: 0.01ms !important; }
    }
  </style>

  <!-- Order matters: script.js registers the Alpine component BEFORE Alpine's own
       script runs (all deferred, so they execute in document order). motion.js only
       defines window.TangoMotion; script.js starts it once the content has rendered. -->
  <script src="script.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
</head>
<body x-data="site()" x-init="init()" x-cloak class="bg-bg text-texto antialiased">
  <a href="#main" class="skip-link">Skip to content</a>

  <!-- ==========================================================================
       HEADER
       ========================================================================== -->
  <header id="top" :class="{ 'shadow-sm': scrolled }" class="sticky top-0 z-50 bg-header/90 backdrop-blur-md backdrop-saturate-150 transition-shadow duration-500">
    <div class="hdr-in max-w-[1180px] mx-auto px-6 h-[76px] flex items-center justify-between gap-6">
      <a href="#top" class="flex items-center" aria-label="Tango Para La Vida home">
        <img src="assets/logo.png" :alt="content && content.header.logoAlt" class="h-8 w-auto" />
      </a>

      <template x-if="content">
        <nav class="hidden md:flex items-center gap-7 lg:gap-9 text-[15px] font-semibold text-principal" aria-label="Primary">
          <template x-for="item in content.header.nav" :key="item.href">
            <a :href="item.href" x-text="item.label" class="nav-link hover:text-acento transition-colors duration-[0.4s]"></a>
          </template>
        </nav>
      </template>

      <div class="flex items-center gap-2 sm:gap-3">
        <!-- Visible on every width: the booking CTA is the page's one conversion path. -->
        <a href="#contact" x-text="content && content.header.ctaTexto"
           class="btn btn-sm md:h-11 md:min-h-11 md:px-6 rounded-full border-2 border-detalle bg-detalle text-texto font-bold shadow-button cursor-pointer transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:scale-[1.04] hover:shadow-[0_12px_28px_rgba(246,180,14,0.4)] active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-principal">Book a Call</a>

        <button @click="mobileMenuOpen = !mobileMenuOpen" @keydown.escape.window="mobileMenuOpen = false" class="md:hidden flex flex-col justify-center items-center gap-1.5 w-11 h-11 -mr-2 rounded-full cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle" :aria-label="mobileMenuOpen ? 'Close menu' : 'Open menu'" :aria-expanded="mobileMenuOpen" aria-controls="mobile-nav">
          <span class="block h-0.5 w-6 bg-principal rounded-full transition-transform duration-[0.4s]" :class="mobileMenuOpen && 'translate-y-2 rotate-45'"></span>
          <span class="block h-0.5 w-6 bg-principal rounded-full transition-opacity duration-[0.4s]" :class="mobileMenuOpen && 'opacity-0'"></span>
          <span class="block h-0.5 w-6 bg-principal rounded-full transition-transform duration-[0.4s]" :class="mobileMenuOpen && '-translate-y-2 -rotate-45'"></span>
        </button>
      </div>
    </div>

    <!-- Reading progress: a gold hairline that fills as the page scrolls (driven by motion.js). -->
    <div id="scroll-progress" aria-hidden="true"></div>

    <div id="mobile-nav" x-show="mobileMenuOpen" @click.outside="mobileMenuOpen = false"
         x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 -translate-y-3" x-transition:enter-end="opacity-100 translate-y-0"
         x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 -translate-y-3"
         class="md:hidden fixed top-[76px] inset-x-0 bg-header border-b-2 border-principal/15 shadow-[0_24px_40px_-24px_rgba(7,58,124,0.35)] flex flex-col px-6 pt-2 pb-4 z-40" style="display:none">
      <template x-if="content">
        <nav class="flex flex-col text-xl font-bold tracking-tight text-principal" aria-label="Mobile">
          <template x-for="(item, i) in content.header.nav" :key="item.href">
            <a :href="item.href" x-text="item.label" @click="mobileMenuOpen = false"
               class="mnav-link flex items-center justify-between py-3.5 border-b border-principal/10 last:border-b-0 active:text-acento" :style="'--i:' + i"></a>
          </template>
        </nav>
      </template>
    </div>
  </header>

  <main id="main">

    <!-- ==========================================================================
         HERO — the one section allowed a (single, subtle, palette-only) glow.
         ========================================================================== -->
    <section id="hero" class="relative overflow-hidden pt-24 pb-36 md:pt-32 md:pb-40 text-center bg-surface">
      <!-- The outer layer follows the pointer with inertia (motion.js); the inner one keeps the slow drift. -->
      <div id="hero-glow" aria-hidden="true" class="absolute inset-0 pointer-events-none">
        <div class="absolute -inset-x-10 -top-40 h-[640px] blur-[10px] opacity-60 animate-drift"
          style="background: radial-gradient(closest-side, rgba(246,180,14,0.22), transparent 70%) 50% 30% / 60% 60% no-repeat;">
        </div>
      </div>

      <!-- Lead and follow: two floor trails, navy and gold, drawn once behind the headline.
           Decorative only; static under reduced motion (motion.css). -->
      <svg class="hero-trails absolute inset-x-0 bottom-0 w-full h-28 md:h-40 pointer-events-none" viewBox="0 0 1440 360" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <path class="trail trail--lead" d="M-40 300 C 180 300, 260 140, 470 150 S 760 330, 980 250 S 1300 60, 1480 110" />
        <path class="trail trail--follow" d="M-40 330 C 200 320, 300 200, 500 205 S 780 350, 1000 290 S 1320 120, 1480 160" />
      </svg>

      <template x-if="content">
        <div class="relative max-w-4xl mx-auto px-6">
          <!-- Focal moment of the page: the headline steps in letter by letter. -->
          <h1 data-text="rise" style="--d:120ms" class="text-[clamp(2.5rem,1.3rem+4.6vw,5.25rem)] font-extrabold leading-[1.02] tracking-[-0.035em] text-principal" x-text="content.hero.titulo"></h1>
          <p data-fx="haze" style="--d:560ms" class="mt-7 text-lg md:text-xl leading-relaxed text-texto/75 max-w-2xl mx-auto" x-text="content.hero.subtitulo"></p>
          <div data-fx="pop" style="--d:700ms" class="mt-10 flex flex-wrap justify-center gap-4">
            <!-- TODO: replace href with the real booking/calendar link (e.g. Calendly) -->
            <a href="#contact"
               class="btn btn-lg rounded-full border-2 border-detalle bg-detalle text-texto font-bold shadow-button cursor-pointer transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:scale-[1.04] hover:shadow-[0_12px_28px_rgba(246,180,14,0.4)] active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-principal">
              <span x-text="content.hero.ctaPrincipal"></span>
              <svg class="cta-arrow w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
            <a href="#programs" x-text="content.hero.ctaSecundario"
               class="btn btn-lg rounded-full border-2 border-principal bg-surface/60 text-principal font-bold cursor-pointer transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:border-acento hover:text-acento hover:bg-acento/5 hover:scale-[1.04] active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle"></a>
          </div>

          <!-- Shortcut into the level selector: picks the level and scrolls to Programs. -->
          <div data-fx="rise" style="--d:840ms" class="mt-10 flex flex-wrap items-center justify-center gap-x-3 gap-y-2 text-sm">
            <span class="text-texto/70 font-medium" x-text="content.hero.nivelesLabel"></span>
            <template x-for="(p, i) in content.programs.items" :key="p.nombre">
              <button type="button" @click="jumpToLevel(i)"
                      class="level-chip inline-flex items-center gap-2 rounded-full border-[1.5px] border-principal/25 bg-surface px-3.5 py-1.5 font-semibold text-principal cursor-pointer transition-[border-color,color,transform] duration-300 ease-premium hover:border-acento hover:text-acento active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle">
                <span class="w-1.5 h-1.5 rounded-full bg-detalle" aria-hidden="true"></span>
                <span x-text="p.nivelCorto"></span>
              </button>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- ==========================================================================
         BENEFITS
         ========================================================================== -->
    <section class="py-20 md:py-28" id="benefits">
      <div class="max-w-[1180px] mx-auto px-6">
        <template x-if="content">
          <div class="max-w-2xl mx-auto text-center mb-14">
            <h2 data-text="mask" class="text-[clamp(2rem,1.3rem+2.4vw,3.25rem)] leading-[1.08] font-extrabold tracking-[-0.025em] text-principal" x-text="content.benefits.titulo"></h2>
            <p data-fx="haze" style="--d:350ms" class="mt-5 text-lg leading-relaxed text-texto/75" x-text="content.benefits.subtitulo"></p>
          </div>
        </template>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
          <template x-for="(item, i) in (content ? content.benefits.items : [])" :key="item.titulo">
            <div class="card bg-surface border-[1.5px] border-principal rounded-md shadow-card transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:-translate-y-1.5 hover:border-acento hover:shadow-card-hover hover:bg-acento/[0.03]" data-fx="curtain" :style="'--i:' + i">
              <div class="card-body p-8">
                <div :style="'--d:' + (620 + i * 80) + 'ms'" class="fx-child w-12 h-12 rounded-sm bg-secundario/10 text-principal flex items-center justify-center mb-4 [&>svg]:w-6 [&>svg]:h-6" x-html="icon(item.icon)"></div>
                <h3 class="text-xl font-semibold text-principal" x-text="item.titulo"></h3>
                <p class="mt-2 text-[15px] leading-relaxed text-texto/75" x-text="item.descripcion"></p>
              </div>
            </div>
          </template>
        </div>

        <template x-if="content">
          <div class="flex justify-center mt-14">
            <!-- In-page navigation, so it reads as secondary: outline + arrow. Gold stays reserved for booking. -->
            <a href="#how-it-works" data-fx="rise"
               class="btn rounded-full border-2 border-principal bg-transparent text-principal font-bold cursor-pointer transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:border-acento hover:text-acento hover:bg-acento/5 hover:scale-[1.04] active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle">
              <span x-text="content.benefits.ctaTexto"></span>
              <svg class="cta-arrow w-4 h-4 rotate-90" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </a>
          </div>
        </template>
      </div>
    </section>

    <!-- ==========================================================================
         PROGRAMS + PACKAGES — unified: pick a level, see its description, then
         immediately pick a package for that same level right below.
         ========================================================================== -->
    <section class="py-20 md:py-28" id="programs">
      <!-- perspective: gives the main card's "unfold" a real 3D hinge -->
      <div class="max-w-[1180px] mx-auto px-6" style="perspective: 1400px">
        <template x-if="content">
          <div class="max-w-2xl mx-auto text-center mb-12">
            <h2 data-text="focus" class="text-[clamp(2rem,1.3rem+2.4vw,3.25rem)] leading-[1.08] font-extrabold tracking-[-0.025em] text-principal" x-text="content.programs.titulo"></h2>
            <p data-fx="haze" style="--d:500ms" class="mt-5 text-lg leading-relaxed text-texto/75" x-text="content.programs.subtitulo"></p>
          </div>
        </template>

        <template x-if="content">
          <!-- Segmented level selector: the navy pill slides to the chosen level (a partner stepping
               across), instead of each tab repainting on its own. Arrow keys move between levels. -->
          <div class="flex justify-center mb-10" data-fx="rise" style="--d:250ms">
            <div class="level-switch relative grid grid-cols-3 rounded-full border-[1.5px] border-principal/20 bg-surface p-1.5 shadow-card"
                 role="tablist" :aria-label="content.programs.selectorHint"
                 :style="'--sel:' + selectedLevel"
                 @keydown.right.prevent="selectedLevel = (selectedLevel + 1) % content.programs.items.length; $nextTick(() => $el.querySelector('[aria-selected=true]').focus())"
                 @keydown.left.prevent="selectedLevel = (selectedLevel - 1 + content.programs.items.length) % content.programs.items.length; $nextTick(() => $el.querySelector('[aria-selected=true]').focus())">
              <span class="level-switch__pill" aria-hidden="true"></span>
              <template x-for="(p, i) in content.programs.items" :key="p.nombre">
                <button type="button" role="tab" @click="selectedLevel = i"
                        :aria-selected="selectedLevel === i" :tabindex="selectedLevel === i ? 0 : -1"
                        class="relative z-10 w-24 sm:w-32 rounded-full py-2.5 text-[15px] font-bold cursor-pointer transition-colors duration-300 active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle"
                        :class="selectedLevel === i ? 'text-white' : 'text-principal hover:text-acento'"
                        x-text="p.nivelCorto"></button>
              </template>
            </div>
          </div>
        </template>

        <template x-if="content">
          <div class="card bg-surface border-[1.5px] border-principal rounded-lg shadow-card" data-fx="unfold" style="--d:150ms">
            <!-- data-swap: motion.js crossfades this panel when the level changes -->
            <div data-swap class="card-body p-8 md:p-12" x-data="{ get p() { return content.programs.items[selectedLevel]; } }">
              <span class="inline-block text-sm font-semibold text-acento bg-acento/10 rounded-full px-3.5 py-1 mb-5 w-fit" x-text="p.nivel"></span>
              <h3 class="text-[clamp(1.6rem,1.25rem+1.3vw,2.25rem)] leading-tight font-extrabold tracking-[-0.02em] text-principal mb-4" x-text="p.nombre"></h3>
              <p class="text-[17px] leading-relaxed text-texto/75 mb-10 max-w-2xl" x-text="p.proposito"></p>

              <!-- What participants take away — one slide per outcome.
                   w-full: card-body is a flex column, so without it this box shrink-wraps to the
                   whole slide track and overflows the card on small screens. -->
              <div class="w-full max-w-xl mx-auto">
                <h4 class="text-base font-bold text-principal mb-4 text-center">What participants take away</h4>
                <div class="relative">
                  <div class="overflow-hidden rounded-md">
                    <div class="flex transition-transform duration-500 ease-premium" :style="'transform: translateX(-' + (takeawaySlide * 100) + '%)'">
                      <template x-for="(r, ri) in p.resultados" :key="ri">
                        <div class="w-full flex-shrink-0 px-1 transition-opacity duration-500 ease-premium" :class="takeawaySlide === ri ? 'opacity-100' : 'opacity-0'">
                          <div class="flex flex-col items-center text-center gap-5 bg-bg rounded-md p-5 md:p-8">
                            <!-- Real photo when available at r.imagen; falls back to the icon
                                 automatically (via onerror) if the file hasn't been added yet. -->
                            <div class="takeaway-media relative w-full h-44 md:h-52 rounded-md overflow-hidden bg-principal/[0.06] text-principal flex items-center justify-center">
                              <span class="takeaway-icon relative flex items-center justify-center w-20 h-20 rounded-full bg-surface border-[1.5px] border-detalle/70 shadow-card [&_svg]:w-9 [&_svg]:h-9" x-html="icon(r.icon)"></span>
                              <template x-if="r.imagen">
                                <img :src="r.imagen" :alt="r.texto" loading="lazy"
                                     class="absolute inset-0 w-full h-full object-cover"
                                     onerror="this.remove()" />
                              </template>
                            </div>
                            <p class="text-lg md:text-xl leading-snug font-bold tracking-[-0.01em] text-principal max-w-sm" x-text="r.texto"></p>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>

                  <button type="button" @click="takeawaySlide = (takeawaySlide - 1 + p.resultados.length) % p.resultados.length"
                          class="btn btn-circle btn-sm absolute left-2 top-[38%] -translate-y-1/2 border-2 border-principal bg-surface text-principal shadow-card cursor-pointer transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:border-acento hover:text-acento hover:scale-110 active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle"
                          aria-label="Previous outcome"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
                  <button type="button" @click="takeawaySlide = (takeawaySlide + 1) % p.resultados.length"
                          class="btn btn-circle btn-sm absolute right-2 top-[38%] -translate-y-1/2 border-2 border-principal bg-surface text-principal shadow-card cursor-pointer transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:border-acento hover:text-acento hover:scale-110 active:scale-[0.97] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle"
                          aria-label="Next outcome"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
                </div>

                <!-- Each dot is a 24px-tall hit area (WCAG 2.2 target size) around a smaller visible dot. -->
                <div class="flex justify-center mt-4">
                  <template x-for="(r, ri) in p.resultados" :key="ri">
                    <button type="button" @click="takeawaySlide = ri"
                            class="group flex h-6 items-center justify-center rounded-full px-2 cursor-pointer focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-detalle"
                            :aria-label="'Go to outcome ' + (ri + 1)" :aria-current="takeawaySlide === ri">
                      <span class="block h-2 rounded-full transition-[width,background-color] duration-[0.4s]"
                            :class="takeawaySlide === ri ? 'bg-detalle w-6' : 'bg-principal/20 w-2 group-hover:bg-principal/40'"></span>
                    </button>
                  </template>
                </div>
              </div>

              <!-- Packages for this level — live in the same card, right below the description. -->
              <div id="packages" class="mt-10 pt-10 border-t-2 border-principal/15">
                <div class="text-center mb-8">
                  <h4 class="text-xl md:text-2xl font-extrabold tracking-tight text-principal" x-text="content.packages.titulo"></h4>
                  <p class="mt-2 text-texto/70" x-text="content.packages.subtitulo"></p>
                </div>

                <div class="grid md:grid-cols-3 gap-6">

                    aria-label="Previous testimonial">‹</button>
            <button type="button" @click="nextTestimonial()"

                    aria-label="Next testimonial">›</button>

            <!-- Dots are 24px-tall hit areas; the play/pause button gives control over the auto-rotation

            <div class="flex items-center justify-center mt-6">
              <template x-for="(item, i) in content.testimonials.items" :key="i">

    <section class="py-20 md:py-28" id="contact">
      <div class="max-w-[1180px] mx-auto px-6 grid md:grid-cols-[0.9fr_1.4fr] gap-12 items-start">
        <template x-if="content">
          <!-- Contact converges: the copy leads in from the left, the form follows from the right. -->
          <div data-fx="lead" class="text-left">
            <h2 class="text-[clamp(2rem,1.3rem+2.4vw,3.25rem)] leading-[1.08] font-extrabold tracking-[-0.025em] text-principal" x-text="content.formulario.titulo"></h2>

            <p x-show="currentPackage" x-text="'Booking: ' + content.programs.items[selectedLevel].nombre + ', ' + currentPackage.nombre + ' package'" class="mt-6 inline-flex items-center gap-2 rounded-full border-2 border-secundario bg-secundario/10 text-secundario-ink text-sm font-semibold px-4 py-2"></p>

            <p class="mt-8 text-[15px] text-texto/75">
              <span x-text="content.formulario.emailAlternativa"></span>
              <a :href="'mailto:' + content.footer.contacto.email" x-text="content.footer.contacto.email"
                 class="font-bold text-principal underline decoration-detalle decoration-2 underline-offset-4 transition-colors duration-300 hover:text-acento focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-detalle rounded-sm"></a>

        <template x-if="content">
          <!-- TODO: replace action with the real Formspree/Getform endpoint -->
          <form data-fx="follow" class="grid grid-cols-1 sm:grid-cols-2 gap-5 bg-surface border-[1.5px] border-principal p-8 rounded-lg shadow-card"
                x-ref="contactForm" action="https://formspree.io/f/REPLACE_ME" method="POST" novalidate
                @submit.prevent="submitForm()">
            <!-- Level/Package are visible, editable selects, kept in sync with the
                 Programs section above via the shared selectedLevel/selectedPackage
                 state. These hidden inputs mirror their human-readable labels for
                 the actual form submission. -->
            <input type="hidden" name="level" :value="content.programs.items[selectedLevel].nombre" />
            <input type="hidden" name="package" :value="currentPackage ? currentPackage.nombre : ''" />

            <div data-fx="cascade" style="--i:0;--d:350ms" class="flex flex-col gap-1.5">
              <label for="field-name" class="text-sm font-semibold text-principal" x-text="content.formulario.labelNombre"></label>
              <input type="text" id="field-name" name="name" required x-model="form.name" :placeholder="content.formulario.placeholderNombre" autocomplete="name"
                     class="input input-bordered w-full rounded-sm border-2 border-principal/25 bg-surface text-texto transition-colors duration-[0.4s] focus:outline-none focus:border-secundario focus:ring-4 focus:ring-secundario/10" />
            </div>
            <div data-fx="cascade" style="--i:1;--d:350ms" class="flex flex-col gap-1.5">
              <label for="field-email" class="text-sm font-semibold text-principal" x-text="content.formulario.labelEmail"></label>
              <input type="email" id="field-email" name="email" required x-model="form.email" :placeholder="content.formulario.placeholderEmail" autocomplete="email"
                     class="input input-bordered w-full rounded-sm border-2 border-principal/25 bg-surface text-texto transition-colors duration-[0.4s] focus:outline-none focus:border-secundario focus:ring-4 focus:ring-secundario/10" />
            </div>
            <div data-fx="cascade" style="--i:2;--d:350ms" class="flex flex-col gap-1.5">
              <label for="field-level" class="text-sm font-semibold text-principal" x-text="content.formulario.labelNivel"></label>
              <select id="field-level" x-model.number="selectedLevel"
                      class="select select-bordered w-full rounded-sm border-2 border-principal/25 bg-surface text-texto cursor-pointer transition-colors duration-[0.4s] focus:outline-none focus:border-secundario focus:ring-4 focus:ring-secundario/10">
                <template x-for="(p, i) in content.programs.items" :key="p.nombre">
                  <option :value="i" x-text="p.nivelCorto + ': ' + p.nombre"></option>
                </template>
              </select>
            </div>
            <div data-fx="cascade" style="--i:3;--d:350ms" class="flex flex-col gap-1.5">
              <label for="field-package-select" class="text-sm font-semibold text-principal" x-text="content.formulario.labelPaquete"></label>
              <select id="field-package-select" x-model="selectedPackage" @change="form.message = ''"
                      class="select select-bordered w-full rounded-sm border-2 border-principal/25 bg-surface text-texto cursor-pointer transition-colors duration-[0.4s] focus:outline-none focus:border-secundario focus:ring-4 focus:ring-secundario/10">
                <template x-for="pkg in content.programs.items[selectedLevel].paquetes" :key="pkg.id">
                  <option :value="pkg.id" x-text="pkg.nombre + (pkg.destacado ? ' (' + content.packages.recommendedLabel + ')' : '')"></option>
                </template>
              </select>
            </div>
            <div data-fx="cascade" style="--i:4;--d:350ms" class="flex flex-col gap-1.5 sm:col-span-2">
              <label for="field-phone" class="text-sm font-semibold text-principal" x-text="content.formulario.labelTelefono"></label>
              <!-- Free text, no input mask/pattern — any format is accepted. -->
              <input type="tel" id="field-phone" name="phone" x-model="form.phone" :placeholder="content.formulario.placeholderTelefono" autocomplete="tel"
                     class="input input-bordered w-full rounded-sm border-2 border-principal/25 bg-surface text-texto transition-colors duration-[0.4s] focus:outline-none focus:border-secundario focus:ring-4 focus:ring-secundario/10" />
            </div>
            <div data-fx="cascade" style="--i:5;--d:350ms" class="flex flex-col gap-1.5 sm:col-span-2">
              <label for="field-message" class="text-sm font-semibold text-principal" x-text="content.formulario.labelMensaje"></label>
              <textarea id="field-message" name="message" rows="4" required x-model="form.message" :placeholder="content.formulario.placeholderMensaje"
                        class="textarea textarea-bordered w-full rounded-sm border-2 border-principal/25 bg-surface text-texto transition-colors duration-[0.4s] focus:outline-none focus:border-secundario focus:ring-4 focus:ring-secundario/10"></textarea>
            </div>
            <div data-fx="pop" style="--d:900ms" class="sm:col-span-2 mt-1">
              <button type="submit" :disabled="formStatus === 'sending'"
                      class="btn btn-lg w-full rounded-full border-2 border-detalle bg-detalle text-texto shadow-button cursor-pointer transition-[transform,box-shadow,background-color,border-color,color,opacity] duration-[0.4s] ease-premium hover:scale-[1.02] hover:shadow-[0_12px_28px_rgba(246,180,14,0.4)] active:scale-[0.97] disabled:opacity-60 disabled:hover:scale-100">
                <span x-text="formStatus === 'sending' ? content.formulario.botonTextoEnviando : content.formulario.botonTexto"></span>
              </button>
            </div>
            <!-- Screen readers hear the result through this persistent live region (visually hidden, so it
                 takes no grid cell); the visible messages below are aria-hidden to avoid a double read. -->
            <p class="sr-only" role="status" aria-live="polite"
               x-text="formStatus === 'done' ? content.formulario.confirmacion : (formStatus === 'error' ? 'Something went wrong sending your message. Please try again or email us directly.' : '')"></p>
            <p aria-hidden="true" x-show="formStatus === 'done'" x-text="content.formulario.confirmacion" class="status-in sm:col-span-2 text-center font-semibold text-principal bg-secundario/10 border-2 border-secundario p-4 rounded-sm"></p>
            <p aria-hidden="true" x-show="formStatus === 'error'" class="status-in sm:col-span-2 text-center font-semibold text-acento bg-acento/10 border-2 border-acento p-4 rounded-sm">Something went wrong sending your message. Please try again or email us directly.</p>
          </form>
        </template>
      </div>
    </section>

  </main>

  <!-- ==========================================================================
       FOOTER
       ========================================================================== -->
  <footer class="bg-principal text-white pt-20 pb-6">
    <template x-if="content">
      <div class="max-w-[1180px] mx-auto px-6 grid grid-cols-2 md:grid-cols-[1.4fr_1fr_1fr_1fr] gap-8 pb-10">
        <div data-fx="rise" style="--i:0" class="col-span-2 md:col-span-1">
          <img src="assets/logo.png" :alt="content.header.logoAlt" class="h-7 mb-4 brightness-0 invert" />
          <p class="text-sm text-header/70 max-w-xs" x-text="content.footer.tagline"></p>
        </div>

        <div data-fx="rise" style="--i:1">
          <h3 class="text-sm font-semibold text-detalle mb-3" x-text="content.footer.columnaPrograms"></h3>
          <nav class="flex flex-col gap-2.5">
            <template x-for="p in content.programs.items" :key="p.nombre">
              <a href="#programs" x-text="p.nombre" class="text-sm text-white/80 hover:text-detalle transition-colors duration-[0.4s]"></a>
            </template>
          </nav>
        </div>

        <div data-fx="rise" style="--i:2">
          <h3 class="text-sm font-semibold text-detalle mb-3" x-text="content.footer.columnaCompany"></h3>
          <nav class="flex flex-col gap-2.5">
            <template x-for="item in content.header.nav" :key="item.href">
              <a :href="item.href" x-text="item.label" class="text-sm text-white/80 hover:text-detalle transition-colors duration-[0.4s]"></a>
            </template>
          </nav>
        </div>

        <div data-fx="rise" style="--i:3">
          <h3 class="text-sm font-semibold text-detalle mb-3" x-text="content.footer.contacto.emailLabel"></h3>
          <!-- TODO: confirm real contact email -->
          <a :href="'mailto:' + content.footer.contacto.email" x-text="content.footer.contacto.email" class="block mb-4 text-sm text-white/80 hover:text-detalle transition-colors duration-[0.4s]"></a>
          <h3 class="text-sm font-semibold text-detalle mb-3" x-text="content.footer.contacto.telefonoLabel"></h3>
          <!-- TODO: confirm real contact phone -->
          <span class="block text-sm text-white/80" x-text="content.footer.contacto.telefono"></span>
        </div>
      </div>
    </template>

    <template x-if="content">
      <div class="max-w-[1180px] mx-auto px-6 pt-6 border-t border-white/10 text-xs text-white/60">
        <p>&copy; <span x-text="new Date().getFullYear()"></span> <span x-text="content.footer.copyright"></span></p>
        <p class="mt-1">Website by <a href="https://www.waterwerk-websolutions.nl" target="_blank" rel="noopener" class="underline underline-offset-2 hover:text-detalle transition-colors duration-[0.4s]">Waterwerk Websolutions</a></p>
      </div>
    </template>
  </footer>

</body>
</html>
